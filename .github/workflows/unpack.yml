
name: Unpack ZIP into repository

'on':
  workflow_dispatch:
  push:
    paths:
      - 'TibiaME_Assist_GitHub.zip'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="TibiaME_Assist_GitHub.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          fi

          if [ -z "${ZIP_FILE:-}" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Nie znaleziono ZIP-a w katalogu głównym."
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "=== Zawartość ZIP ==="
          find extracted -maxdepth 4 -type f

          cp -an extracted/. .
          rm -rf extracted

      - name: Commit extracted files
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Brak nowych zmian do zapisania."
            exit 0
          fi
          git commit -m "Extract TibiaME Assist ZIP"
          git push
